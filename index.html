<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bonavista — discover movies and TV with a clearer view. Created by Ryheem Bonaparte.">
    <title>Bonavista — by Ryheem Bonaparte</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <h1>Bonavista</h1>
        </div>
        <div class="nav-right">
            <a href="#" class="nav-home active" onclick="showHomeView()">Home</a>
            <a href="#" class="nav-movies nav-desktop" onclick="showMoviesView()">Movies</a>
            <a href="#" class="nav-tv" onclick="showTVView()" title="TV Series">
                <span class="nav-text">TV Series</span>
            </a>
            <a href="#" class="nav-new nav-desktop" onclick="showNewPopularView()">Fresh Finds</a>
            <a href="#" class="nav-genres nav-desktop" onclick="document.getElementById('genreBar').scrollIntoView({behavior:'smooth'})">Genres</a>
            <a href="#" class="nav-favorites" onclick="displayFavorites()" title="Saved">
                <i class="fas fa-bookmark" aria-hidden="true"></i>
                <span>Saved</span>
            </a>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search titles..." aria-label="Search movies and TV shows">
                <button class="search-button" title="Search" aria-label="Search">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1 class="brand-mark">Bonavista</h1>
            <p class="hero-tagline">A clearer view of what to watch next.</p>
            <p class="hero-feature">Loading today’s feature…</p>
            <div class="hero-buttons">
                <button class="btn-play" type="button">
                    <i class="fas fa-play"></i> Watch Trailer
                </button>
                <button class="btn-more" type="button">
                    <i class="fas fa-info-circle"></i> Details
                </button>
            </div>
        </div>
    </section>

    <div id="genreBar" class="genre-bar" aria-label="Browse by genre"></div>

    <main>
        <!-- Content rows are loaded by app.js -->
    </main>

    <div id="movieModal" class="modal">
        <button class="modal-close" aria-label="Close modal">&times;</button>
        <div class="modal-content">
            <div class="movie-details">
                <div class="movie-header">
                    <img src="" alt="">
                    <div class="movie-info">
                        <h2></h2>
                        <p class="overview"></p>
                        <div class="movie-stats">
                            <span><i class="fas fa-star"></i></span>
                            <span><i class="fas fa-calendar"></i></span>
                            <span><i class="fas fa-clock"></i></span>
                        </div>
                        <div class="hero-buttons">
                            <button class="btn-play" type="button">
                                <i class="fas fa-play"></i> Watch Trailer
                            </button>
                            <button class="btn-more" type="button">
                                <i class="fas fa-bookmark"></i> Save
                            </button>
                        </div>
                    </div>
                </div>
                <div class="trailer-section">
                    <h3>Trailer</h3>
                    <div class="trailer-container">
                        <iframe src="" title="Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <footer class="footer">
        <p>Bonavista · Created by Ryheem Bonaparte</p>
        <p class="copyright">© 2026 All rights reserved · Not affiliated with any streaming service</p>
    </footer>
</body>
</html>
